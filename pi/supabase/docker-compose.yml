services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AOG_PG_PASSWORD:?set AOG_PG_PASSWORD in pi/supabase/.env}
      AOG_AUTHENTICATOR_PASSWORD: ${AOG_AUTHENTICATOR_PASSWORD:?set AOG_AUTHENTICATOR_PASSWORD in pi/supabase/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/01-aog.sh:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql.template:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aog"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AOG_AUTHENTICATOR_PASSWORD:?set AOG_AUTHENTICATOR_PASSWORD in pi/supabase/.env}@db:5432/aog
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${AOG_JWT_SECRET:?set AOG_JWT_SECRET in pi/supabase/.env (32+ random bytes)}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:8000

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
